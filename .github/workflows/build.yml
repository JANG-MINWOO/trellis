name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default: pull requests from forks build here too. Only the release job writes.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check (types, lint, format, i18n, structure, unit tests)
        run: npm run check
      - name: Package
        run: npm run ${{ matrix.dist }}
      # The fake CLI is a shebang script, so these run on macOS only (they skip on Windows).
      - name: E2E — launch, intent → decisions/specs, guard (macOS, fake Claude CLI)
        if: runner.os == 'macOS'
        run: npx playwright test smoke intent guard
      - uses: actions/upload-artifact@v4
        with:
          name: trellis-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
